<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Polonia"><title>Viaje a Polonia</title><style>:root{--bg:#07111f;--card:#0e1b2d;--card2:#13243a;--ink:#f5f7fb;--mut:#8fa0b7;--line:#20344d;--a:#ff5a5f;--y:#ffcc66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:560px;margin:auto;padding:max(42px,calc(env(safe-area-inset-top) + 24px)) 14px calc(42px + env(safe-area-inset-bottom))}.eye{font-size:.68rem;letter-spacing:.18em;font-weight:800;color:var(--a)}h1{font-size:2.2rem;margin:4px 0}.mut{color:var(--mut)}.route{margin:10px 0 18px;color:var(--y);font-size:.75rem;font-weight:800;letter-spacing:.08em}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:15px;position:sticky;top:max(10px,env(safe-area-inset-top));z-index:5}.tabs button,.days button,.q{font:inherit}.tabs button{min-height:44px;border:0;background:transparent;color:var(--mut);border-radius:11px;font-size:.8rem;font-weight:750}.tabs button.on{background:var(--a);color:#fff}.hide{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}.days{display:flex;gap:7px;overflow:auto;margin:14px -14px 0;padding:0 14px}.days button{flex:0 0 auto;min-width:54px;min-height:46px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:13px;font-weight:750}.days button.on{background:var(--y);color:#15191f}.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item a{float:right;color:var(--y);text-decoration:none}.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.q{padding:11px 4px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px}.q span,.ph span{display:block;color:var(--mut);font-size:.84rem}.ph b,.ph em{display:block}.ph em{font-style:normal;color:var(--y);font-weight:700}input{width:100%;padding:12px;margin:6px 0 12px;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:11px}label{display:block;color:var(--mut);font-size:.8rem}</style></head><body><main><div class="eye">VIAJE 2026</div><h1>Polonia</h1><div class="mut">Plan, cambio y frases para tenerlo todo a mano.</div><div class="route">CRACOVIA — VARSOVIA</div><div class="tabs"><button data-t="plan" class="on">Plan</button><button data-t="cambio">Cambio</button><button data-t="frases">Frases</button></div><section id="plan"><div class="days" id="days"></div><div class="card" id="daycard"></div></section><section id="cambio" class="hide"><div class="card"><h2>Cambio de moneda</h2><label>Zlotys (zł)</label><input type="number" id="zl" inputmode="decimal"><label>Euros (€)</label><input type="number" id="eu" inputmode="decimal"><label>Cambio: 1 zł = €</label><input type="number" id="rate" value="0.23" step="0.001"><h2>Importes rápidos</h2><div class="qgrid" id="quick"></div></div></section><section id="frases" class="hide"><div class="card"><h2>Frases en polaco</h2><div class="mut">🗣 En amarillo, cómo pronunciarlo leyendo en castellano.</div><div id="phr"></div></div></section></main><script>const D=[['Dom','Domingo · Cracovia',[['Free tour por Cracovia','Rynek Główny, Kraków'],['Comer en la zona central','Rynek Główny, Kraków'],['Tarde: plaza, Planty o Wawel','Wawel Royal Castle, Kraków']]],['Lun','Lunes · Auschwitz-Birkenau',[['Auschwitz I','Auschwitz-Birkenau Memorial Museum'],['Birkenau (Auschwitz II)','Auschwitz II-Birkenau']]],['Mar','Martes · Cracovia → Varsovia',[['Tren Cracovia → Varsovia','Kraków Główny railway station'],['Paseo por el centro de Varsovia','Warsaw Old Town'],['Parque Łazienki / Ciudad Nueva','Łazienki Park, Warsaw'],['Calle Nowy Świat','Nowy Świat, Warszawa']]],['Mié','Miércoles · Varsovia',[['Tour comunista por Varsovia','Palace of Culture and Science, Warsaw'],['Barrio de Praga','Praga, Warszawa'],['Tren Varsovia → Cracovia','Warszawa Centralna']]],['Jue','Jueves · Cracovia',[['Kazimierz','Kazimierz, Kraków'],['Comer en Starka','Starka Kraków'],['Podgórze','Podgórze, Kraków'],['Fábrica de Schindler','Schindler Factory Kraków']]],['Vie','Viernes · Cracovia',[['Lonja de los Paños','Sukiennice, Kraków'],['Comer por el centro','Rynek Główny, Kraków'],['Minas de sal de Wieliczka','Wieliczka Salt Mine']]],['Sáb','Sábado · Cracovia',[['Día libre',''],['Cena en Morskie Oko','Morskie Oko restaurante Kraków']]]];const P=[['Hola','Cześć','chesh'],['Buenos días','Dzień dobry','yen dobri'],['Buenas noches','Dobranoc','dobranots'],['Adiós','Do widzenia','do videnia'],['Gracias','Dziękuję','yenkuie'],['Por favor','Proszę','proshe'],['Perdón','Przepraszam','sheprasham'],['No entiendo','Nie rozumiem','nie rosumiem'],['Una cerveza, por favor','Piwo, proszę','pivo proshe'],['La cuenta, por favor','Rachunek, proszę','rajunek proshe'],['¿Dónde está…?','Gdzie jest…?','gie yest'],['Estación de tren','Dworzec kolejowy','dvoshets koleiovi'],['¡Ayuda!','Pomocy!','pomotsi'],['Farmacia','Apteka','apteka']];let day=0,$=x=>document.getElementById(x);function map(q){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function render(){days.innerHTML=D.map((d,i)=>`<button data-i="${i}" class="${i===day?'on':''}">${d[0]}</button>`).join('');daycard.innerHTML=`<h2>${D[day][1]}</h2>`+D[day][2].map(x=>`<div class="item">${x[0]}${x[1]?`<a target="_blank" href="${map(x[1])}">Mapa</a>`:''}</div>`).join('')}days.onclick=e=>{if(e.target.dataset.i!=null){day=+e.target.dataset.i;render()}};document.querySelector('.tabs').onclick=e=>{let t=e.target.dataset.t;if(!t)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['plan','cambio','frases'].forEach(x=>$(x).classList.toggle('hide',x!==t))};function conv(a){let r=+rate.value||.23;if(a==='z')eu.value=((+zl.value||0)*r).toFixed(2);else zl.value=((+eu.value||0)/r).toFixed(2);quick()}zl.oninput=()=>conv('z');eu.oninput=()=>conv('e');rate.oninput=()=>conv('z');function quick(){let r=+rate.value||.23;$('quick').innerHTML=[5,10,20,50,100,200].map(z=>`<button class="q" data-z="${z}"><b>${z} zł</b><span>${(z*r).toFixed(2)} €</span></button>`).join('')}$('quick').onclick=e=>{let z=e.target.closest('.q')?.dataset.z;if(z){zl.value=z;conv('z')}};$('phr').innerHTML=P.map(x=>`<div class="item ph"><b>${x[0]}</b><em>🗣 ${x[2]}</em><span>${x[1]}</span></div>`).join('');render();quick();</script></body></html>
